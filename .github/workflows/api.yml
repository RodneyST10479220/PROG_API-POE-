name: APIRun-Day

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore "PROG_API(POE)/PROG_API(POE).csproj"

      - name: Build project
        run: dotnet build "PROG_API(POE)/PROG_API(POE).csproj" --configuration Release --no-restore
