name: APIRun-Day

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  workflow-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm workflow is running
        run: echo "APIRun-Day workflow is running successfully!"

      - name: Check project files
        run: |
          echo "Checking for the .NET project..."
          test -f "PROG_API(POE)/PROG_API(POE).csproj"
          echo "Project file found!"
